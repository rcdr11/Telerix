# Telerix (veränderte Version)
#
# Einrichten und starten:  ./install.sh
# Webinterface:            http://127.0.0.1:8080
#
# Diese Datei bitte nicht ändern, sonst bricht update.sh wegen lokaler
# Änderungen ab. Eigene Einstellungen gehören in die Datei .env (siehe
# .env.example), zusätzliche Ports oder Dienste in eine
# docker-compose.override.yml (siehe docs/konfiguration.md). Beide werden
# nicht eingecheckt.

name: telerix

services:
  telerix:
    build: .
    # Fester lokaler Name; die Version steht im Webinterface (Info/Updates)
    image: telerix:local
    restart: unless-stopped
    # Zeit zum Abmelden beim SIP-Anbieter vor dem Beenden (siehe docker/asterisk-run.sh)
    stop_grace_period: 30s
    ports:
      # Webinterface nur lokal erreichbar
      - "127.0.0.1:8080:8080"
    environment:
      TELERIX_ADMIN_USER: admin
      TELERIX_ADMIN_PASSWORD_FILE: /run/secrets/telerix_admin_password
      # Alle folgenden Werte kommen aus .env; leer = Funktion aus bzw. die
      # Einstellung im Webinterface gilt (siehe docs/konfiguration.md)
      TELERIX_UPDATE_REPO: ${TELERIX_UPDATE_REPO:-}
      TELERIX_EXTERNAL_ADDRESS: ${TELERIX_EXTERNAL_ADDRESS:-}
      TELERIX_TRUSTED_PROXIES: ${TELERIX_TRUSTED_PROXIES:-}
      TELERIX_COOKIE_SECURE: ${TELERIX_COOKIE_SECURE:-0}
      TELERIX_TESTPHONE_PASSWORD: ${TELERIX_TESTPHONE_PASSWORD:-}
      TELERIX_AUDIO_ANHEBUNG_DB: ${TELERIX_AUDIO_ANHEBUNG_DB:-}
      TELERIX_AUDIO_PUFFER_SEKUNDEN: ${TELERIX_AUDIO_PUFFER_SEKUNDEN:-}
    secrets:
      - telerix_admin_password
    volumes:
      - telerix-data:/var/lib/telerix
    # Nur die Rechte, die zum Starten und Abgeben der Rechte nötig sind
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      # setgid-Bit auf den von Asterisk gelesenen Datenverzeichnissen setzen
      - FSETID
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true

secrets:
  telerix_admin_password:
    file: ./secrets/admin_password.txt

volumes:
  telerix-data:
