; Nachgebildeter Anbieter: nimmt die Registrierung von Telerix an (Benutzer
; 4711) und kann Telerix anrufen. Mehrere Kontakte pro Benutzer erlaubt und
; nichts ersetzen, damit doppelte Registrierungen wie bei sipgate sichtbar
; werden.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[4711]
type=auth
auth_type=userpass
username=4711
password=TestGeheim123

[4711]
type=aor
max_contacts=10
remove_existing=no
default_expiration=600
minimum_expiration=60

[4711]
type=endpoint
transport=transport-udp
context=provider
disallow=all
allow=g722,alaw
auth=4711
aors=4711
direct_media=no
