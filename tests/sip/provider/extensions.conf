[general]

; Wie ein echter Anbieter (z. B. sipgate): einen Anruf an ALLE registrierten
; Kontakte des Benutzers 4711 gleichzeitig verzweigen.
[provider]
exten = anruf,1,Dial(${PJSIP_DIAL_CONTACTS(4711)},60)
same = n,Hangup()

; Wie "anruf", aber das Angebot enthält nur G.722 (Endpunkt nurg722)
; (Kontakt ohne das vorangestellte "PJSIP/4711/")
exten = nurg722,1,Set(KONTAKT=${PJSIP_DIAL_CONTACTS(4711)})
same = n,Dial(PJSIP/nurg722/${KONTAKT:11},60)
same = n,Hangup()
