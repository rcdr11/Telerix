# Test-Reverse-Proxy vor Telerix (wie ein externer nginx mit HTTPS/Basic-Auth,
# hier ohne TLS): leitet an http://telerix:8080 weiter und setzt
# X-Forwarded-For und X-Forwarded-Proto.
worker_processes 1;
pid /tmp/proxy-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/proxy-body;
    proxy_temp_path /tmp/proxy-temp;
    server {
        listen 80;
        # Docker-DNS, damit ein neu erzeugter Telerix-Container gefunden wird
        resolver 127.0.0.11 valid=5s;
        set $upstream http://telerix:8080;
        location / {
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
