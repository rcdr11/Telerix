[general]
static=yes
writeprotect=yes

; Testtelefon (optional, siehe pjsip.conf)
[from-internal]
exten = 100,1,Answer()
same = n,Wait(1)
same = n,Playback(beep)
same = n,Wait(1)
same = n,MusicOnHold(stream)
same = n,Hangup()

; Eingehende Anrufe vom SIP-Anbieter
[sip-in]
exten = 200,1,Ringing()
; Codec-Diagnose: Vor dem Annehmen enthält audionativeformat die Codecs, die
; der Anbieter angeboten hat und die Telerix ebenfalls kann, in der
; Reihenfolge von Telerix (incoming_call_offer_pref=local, siehe
; telerix/lib/sip.php); bei "Telefonqualität bevorzugen" nur den ersten.
same = n,Set(ANGEBOT=${CHANNEL(audionativeformat)})
same = n,Answer()
; Beginn für die Gesprächsdauer beim Auflegen (h-Extension); CDR ist aus
same = n,Set(ANRUF_BEGINN=${EPOCH})
; Ausgehandelten Codec (g722 = HD, alaw/ulaw = Telefonqualität) für die
; Anzeige im Webinterface merken. accountcode wird sonst nicht verwendet
; (CDR ist aus) und erscheint in "core show channels concise".
same = n,Set(CHANNEL(accountcode)=${CHANNEL(audionativeformat)})
; Ins Protokoll (docker compose logs), ohne Rufnummer; die Kennung des
; Anrufs (UNIQUEID) verbindet die Zeile mit der beim Auflegen
same = n,Log(NOTICE,Anruf ${UNIQUEID}: Codec: angeboten und unterstützt ${ANGEBOT}, gewählt ${CHANNEL(audionativeformat)})
same = n,Wait(1)
; Ansage im Webinterface abgeschaltet: sofort der Stream
same = n,GotoIf(${STAT(e,/var/lib/telerix/asterisk/ansage_aus)}?stream)
; Eigene Ansage aus dem Webinterface, sonst die mitgelieferte. Asterisk
; wählt je Anrufer die passende Datei: ansage.wav16 (16 kHz) für G.722,
; ansage.wav (8 kHz) für G.711. Installationen von vor 0.06-mod ohne
; Original haben nur ansage.wav.
same = n,Set(ANSAGE=${IF($[${STAT(e,/var/lib/telerix/sounds/ansage.wav16)} | ${STAT(e,/var/lib/telerix/sounds/ansage.wav)}]?/var/lib/telerix/sounds/ansage:tx/willkommen-gottesdienst)})
same = n,Playback(${ANSAGE})
same = n,Wait(1)
same = n(stream),MusicOnHold(stream)
same = n,Hangup()

; Manche Anbieter senden statt "200" die eigene Rufnummer bzw. SIP-ID
exten = _[0-9a-zA-Z+]!,1,Goto(sip-in,200,1)
; Eigene h-Extension, damit das Muster oben nicht beim Auflegen greift.
; Beim Auflegen eine Zeile ins Protokoll (ohne Rufnummer): Kennung, Dauer,
; Grund (HANGUPCAUSE, Q.850) und wer aufgelegt hat. CHANNEL(hangupsource)
; ist der eigene Kanal, wenn der Anrufer (bzw. der Anbieter) aufgelegt hat,
; "dialplan/builtin", wenn der Wählplan endete, und leer, wenn Telerix von
; außen aufgelegt hat ("Alle Anrufer auflegen", Neustart).
exten = h,1,GotoIf($["${ANRUF_BEGINN}" = ""]?vorher)
same = n,Set(DAUER=$[${EPOCH} - ${ANRUF_BEGINN}])
same = n,Set(QUELLE=${CHANNEL(hangupsource)})
same = n,Set(WER=${IF($["${QUELLE}" = "${CHANNEL(name)}"]?Anrufer:${IF($["${QUELLE}" = "dialplan/builtin"]?Telerix (Wählplan beendet):Telerix (aufgelegt oder neu gestartet))})})
same = n,Set(GRUND=${IF($[0${HANGUPCAUSE} = 16]?normal:${IF($[0${HANGUPCAUSE} = 31]?normal:${IF($[0${HANGUPCAUSE} = 0]?ohne Angabe:siehe Q.850)})})})
same = n,Log(NOTICE,Anruf ${UNIQUEID} beendet: Dauer ${DAUER} s, Grund ${HANGUPCAUSE} (${GRUND}), aufgelegt von ${WER})
; Statistik für die Startseite (lib/asterisk.php, call_stats): je Stunde
; (UTC) Anzahl, Gesamtdauer und Anrufe unter 30 s, in der AstDB
same = n,Set(STUNDE=${STRFTIME(${EPOCH},UTC,%Y%m%d%H)})
same = n,Set(DB(telerix_anrufe/${STUNDE}/anzahl)=$[0${DB(telerix_anrufe/${STUNDE}/anzahl)} + 1])
same = n,Set(DB(telerix_anrufe/${STUNDE}/sekunden)=$[0${DB(telerix_anrufe/${STUNDE}/sekunden)} + ${DAUER}])
same = n,Set(DB(telerix_anrufe/${STUNDE}/kurz)=$[0${DB(telerix_anrufe/${STUNDE}/kurz)} + (${DAUER} < 30)])
same = n,Hangup()
; Vor dem Annehmen aufgelegt (selten, Telerix nimmt sofort an)
same = n(vorher),Log(NOTICE,Anruf ${UNIQUEID} vor dem Annehmen beendet, Grund ${HANGUPCAUSE})
