[general]
static=yes
writeprotect=yes

; Testtelefon (optional, siehe pjsip.conf)
[from-internal]
exten = 100,1,Answer()
same = n,Wait(1)
same = n,Playback(beep)
same = n,Wait(1)
same = n,MusicOnHold(stream)
same = n,Hangup()

; Eingehende Anrufe vom SIP-Anbieter
[sip-in]
exten = 200,1,Ringing()
same = n,Answer()
same = n,Wait(1)
; Eigene Ansage aus dem Webinterface, sonst die mitgelieferte
same = n,Set(ANSAGE=${IF(${STAT(e,/var/lib/telerix/sounds/ansage.wav)}?/var/lib/telerix/sounds/ansage:tx/willkommen-gottesdienst)})
same = n,Playback(${ANSAGE})
same = n,Wait(1)
same = n,MusicOnHold(stream)
same = n,Hangup()

; Manche Anbieter senden statt "200" die eigene Rufnummer bzw. SIP-ID
exten = _[0-9a-zA-Z+]!,1,Goto(sip-in,200,1)
; Eigene h-Extension, damit das Muster oben nicht beim Auflegen greift
exten = h,1,NoOp(Anruf beendet)
