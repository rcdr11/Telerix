; Telerix – PJSIP-Konfiguration (ersetzt die chan_sip-Datei sip.conf).
; chan_sip ist seit Asterisk 21 entfernt.

[global]
type=global
user_agent=TELERIX 0.06-mod
; Nur bekannte Gegenstellen (per IP oder Benutzername), keine anonymen Anrufe
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Private Netze (Docker, Heimnetz) gelten als lokal
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
; Öffentliche Adresse für SIP/RTP hinter NAT (external_media_address,
; external_signaling_address) – erzeugt aus der Einstellung im Webinterface
; bzw. TELERIX_EXTERNAL_ADDRESS, ohne Adresse nur ein Kommentar
#include /var/lib/telerix/asterisk/pjsip_external.conf

; Registrierung beim SIP-Anbieter – wird vom Webinterface erzeugt
#include /var/lib/telerix/asterisk/pjsip_trunk.conf

; Optionales Testtelefon (Kontext from-internal, Extension 100) – erzeugt aus
; der Einstellung im Webinterface bzw. TELERIX_TESTPHONE_PASSWORD, ohne
; Passwort kein Endpunkt
#include /var/lib/telerix/asterisk/pjsip_testphone.conf
