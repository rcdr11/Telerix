[general]
dateformat = %F %T
; Keine Datei queue_log (app_queue wird nicht geladen)
queue_log = no

[logfiles]
; Alles geht nur noch auf die Konsole und damit ins Container-Log (docker
; compose logs), dessen Größe Docker begrenzt (docker-compose.yml,
; logging). Eine eigene messages.log gibt es ab 0.07-mod nicht mehr: Sie
; enthielt dieselben Meldungen ein zweites Mal und wuchs ohne Grenze, weil im
; Container kein crond für logrotate läuft (bis 2,8 GB in 18 Tagen).
; Meldungen von SIP-Scannern fasst docker/asterisk-log.awk stündlich
; zusammen, siehe docs/konfiguration.md.
console => notice,warning,error
