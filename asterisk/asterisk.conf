; Verzeichnisse wie im Alpine-Paket (ohne "(!)" – das würde den Abschnitt zur
; Vorlage machen und Asterisk würde ihn ignorieren). Nicht aufgeführt sind
; astkeydir und astagidir: res_crypto und AGI werden nicht geladen.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
; Sounds (Ansage tx/, Töne wie beep) liegen im Alpine-Paket unter /usr/share
astdatadir => /usr/share/asterisk
astcachedir => /var/cache/asterisk
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Nur runuser setzen: dann übernimmt Asterisk per initgroups() auch die
; Zusatzgruppe astctl (mit rungroup/-G würden Zusatzgruppen gelöscht)
runuser = asterisk
; Dialplan-Funktionen wie SHELL() nicht über externe Schnittstellen zulassen
live_dangerously = no

[files]
; Control-Socket für "asterisk -rx" aus dem Webinterface:
; Gruppe astctl (asterisk + telerix), kein sudo nötig.
astctlpermissions = 0660
astctlowner = asterisk
astctlgroup = astctl
astctl = asterisk.ctl
