; Protokollierung von pjproject (SIP-Bibliothek) in das Asterisk-Log
[startup]
log_level = default

; pjproject-Stufen (0 bis 6) -> Asterisk-Stufen, wie die Vorgabe von
; Asterisk. Nicht aufgeführte Stufen werden verworfen.
;   1 = Fehler, 2 = Warnungen (u. a. "Dropping ... packet" bei ungültigen
;   Paketen von SIP-Scannern; die fasst docker/asterisk-log.awk zusammen)
;   4 = Einzelheiten, u. a. der vollständige Inhalt jedes verworfenen
;   Pakets über viele Zeilen. Bis 0.06-mod war 4 als NOTICE eingestellt;
;   das füllte das Log mit dem Datenmüll der Scanner. Jetzt nur noch als
;   Debug (sichtbar mit "core set debug 1").
[log_mappings]
type = log_mappings
asterisk_error = 0,1
asterisk_warning = 2
asterisk_debug = 3,4,5
