# nginx für das Telerix-Webinterface
user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # Uploads: Ansage bis 20 MB (+ Formular-Overhead)
    client_max_body_size 21m;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080 default_server;
        # "listen [::]:8080" nur, wenn IPv6 im Container nutzbar ist; vom
        # Entrypoint erzeugt (sonst leer), damit nginx auch ohne IPv6 startet
        include /etc/nginx/telerix-listen-ipv6.conf;
        server_name _;

        # Nur telerix/public ist erreichbar; lib/, bin/ und das
        # Datenverzeichnis liegen außerhalb.
        root /opt/telerix/public;
        index index.php;

        # Echte Client-IP hinter einem Reverse-Proxy (TELERIX_TRUSTED_PROXIES),
        # vom Entrypoint erzeugt; leer, wenn kein Proxy eingetragen ist
        include /etc/nginx/telerix-realip.conf;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

        # Versteckte Dateien nie ausliefern
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Nur existierende PHP-Dateien im Webroot ausführen
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php-fpm/telerix.sock;
            fastcgi_index index.php;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_read_timeout 180s;
        }
    }
}
