[telerix]
; PHP läuft als eigener, unprivilegierter Benutzer (Mitglied von astctl)
user = telerix
group = telerix

listen = /run/php-fpm/telerix.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[TELERIX_COOKIE_SECURE] = $TELERIX_COOKIE_SECURE

; Nur .php ausführen
security.limit_extensions = .php

php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[memory_limit] = 64M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 21M
php_admin_value[max_file_uploads] = 1
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_path] = /run/telerix/sessions
php_admin_value[session.gc_maxlifetime] = 14400
php_admin_flag[allow_url_include] = off
; Dateizugriff nur auf Programm, Daten und Temp-Verzeichnisse
php_admin_value[open_basedir] = /opt/telerix:/var/lib/telerix:/run/telerix:/tmp:/etc/os-release:/usr/lib/os-release
; Externe Programme nur über proc_open mit Argument-Array (lib/asterisk.php)
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,pcntl_exec
