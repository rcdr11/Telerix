[telerix]
; PHP läuft als eigener, unprivilegierter Benutzer (Mitglied von astctl)
user = telerix
group = telerix

listen = /run/php-fpm/telerix.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[TELERIX_COOKIE_SECURE] = $TELERIX_COOKIE_SECURE
env[TELERIX_UPDATE_REPO] = $TELERIX_UPDATE_REPO
; Für die Anzeige im Webinterface; gesetzte Werte haben Vorrang vor den
; Einstellungen dort (lib/settings.php)
env[TELERIX_TRUSTED_PROXIES] = $TELERIX_TRUSTED_PROXIES
env[TELERIX_EXTERNAL_ADDRESS] = $TELERIX_EXTERNAL_ADDRESS
env[TELERIX_TESTPHONE_PASSWORD] = $TELERIX_TESTPHONE_PASSWORD
env[TELERIX_AUDIO_ANHEBUNG_DB] = $TELERIX_AUDIO_ANHEBUNG_DB
env[TELERIX_AUDIO_PUFFER_SEKUNDEN] = $TELERIX_AUDIO_PUFFER_SEKUNDEN

; Nur .php ausführen
security.limit_extensions = .php

php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
; Sicherungen werden im Speicher ver- und entschlüsselt (Ansage bis ca. 20 MB,
; Sicherung bis 32 MB, lib/backup.php); Ansagen selbst bis 20 MB (lib/audio.php)
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 33M
php_admin_value[max_file_uploads] = 1
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_path] = /run/telerix/sessions
php_admin_value[session.gc_maxlifetime] = 14400
; Wird nicht gebraucht. Abgeschaltet als zusätzlicher Schutz gegen
; CVE-2026-109619: Der Upload-Fortschritt greift ohne session_start() auf
; Sitzungszustand zu (behoben in PHP 8.4.27, siehe Dockerfile).
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[allow_url_include] = off
; Dateizugriff nur auf Programm, Daten und Temp-Verzeichnisse
php_admin_value[open_basedir] = /opt/telerix:/var/lib/telerix:/run/telerix:/tmp:/etc/os-release:/usr/lib/os-release
; Externe Programme nur über proc_open mit Argument-Array (lib/asterisk.php)
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,pcntl_exec
