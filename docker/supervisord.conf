; Startet Asterisk, PHP-FPM und nginx im Container und hält sie am Laufen.
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:asterisk]
; -f Vordergrund, -U Rechte abgeben (ohne -G, siehe asterisk.conf), -n ohne Farben
command = /usr/sbin/asterisk -f -n -U asterisk
autorestart = true
startsecs = 3
stopsignal = TERM
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:php-fpm]
command = /usr/sbin/php-fpm84 -F -y /etc/php84/php-fpm.conf
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
