; Startet Asterisk, PHP-FPM und nginx im Container und hält sie am Laufen.
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:asterisk]
; Startskript meldet beim Stoppen die SIP-Registrierung ab (siehe asterisk-run.sh)
command = /usr/local/bin/telerix-asterisk
autorestart = true
startsecs = 3
stopsignal = TERM
; Zeit für Abmeldung (max. 5 s) und Beenden; Docker wartet 30 s (stop_grace_period)
stopwaitsecs = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:php-fpm]
command = /usr/sbin/php-fpm84 -F -y /etc/php84/php-fpm.conf
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
